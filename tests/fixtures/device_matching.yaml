# Device-name matching: the cases Subsample and Subsequence must answer alike.
#
# Both apps pick a configured device out of the names a backend reports by the
# same rule (subsample/devices.py, subsequence/midi_utils.py).  A name given in
# full wins outright.  Otherwise the pattern is a case-insensitive glob with an
# implicit * at each end, where * and ? are the only wildcards and [ is literal.
# The rule is written out in both apps' docstrings, and prose alone drifted
# within hours of both sides shipping (subsample#397).  This file is the
# executable half: both test suites assert every case below, so the two apps
# cannot disagree without one of them failing.
#
# Keep the two copies identical.  A case added here goes into the other
# repository's copy in the same breath (subsample#623).
#
# Each list says where its names came from.  Most were reported by a real
# backend; the few that no machine here reports are marked as constructed.  A
# case names the list it is matched against, the pattern, and the names the
# pattern must select, in the order the backend reported them.

lists:

  hpz2g4_audio:
    source: "PortAudio's ALSA host API on hpz2g4, onboard audio only, 2026-09-23"
    names:
      - "HDA Intel PCH: CX20632 Analog (hw:0,0)"
      - "HDA Intel PCH: CX20632 Alt Analog (hw:0,2)"
      - "HDA NVidia: HDMI 0 (hw:1,3)"
      - "HDA NVidia: HDMI 1 (hw:1,7)"
      - "HDA NVidia: HDMI 2 (hw:1,8)"
      - "HDA NVidia: HDMI 3 (hw:1,9)"
      - "sysdefault"
      - "front"
      - "surround40"
      - "surround51"
      - "surround71"
      - "default"
      - "dmix"

  hpz2g4_midi:
    source: "rtmidi, through mido, on hpz2g4, 2026-09-23"
    names:
      - "Midi Through:Midi Through Port-0 14:0"

  studio_audio:
    source: "PortAudio on the author's audio machine, as Subsample's device tests record them"
    names:
      - "SC-U: USB Audio (hw:2,0)"
      - "U6MIDI Pro: USB Audio (hw:0,0)"
      - "HDA Intel PCH: ALC256 Analog (hw:1,0)"

  studio_pipewire:
    source: "PortAudio under PipeWire on the author's audio machine: five of the ten names present, subsample#397"
    names:
      - "default"
      - "Default Sink"
      - "Default Source"
      - "auto_null"
      - "auto_null.monitor"

  studio_midi:
    source: "The ALSA sequencer names Subsequence's device tests use, in the form rtmidi reports a hardware port"
    names:
      - "Midi Through:Midi Through Port-0 14:0"
      - "U6MIDI Pro:U6MIDI Pro Port 1 16:0"
      - "U6MIDI Pro:U6MIDI Pro Port 2 16:1"
      - "U6MIDI Pro:U6MIDI Pro Port 3 16:2"
      - "SC-U:SC-U MIDI 1 24:0"
      - "RtMidiOut Client:Subsample Virtual MIDI 129:0"

  grown_client_id:
    source: "Constructed: studio_midi's Port 1 once the sequencer has handed out client ids past 99"
    names:
      - "U6MIDI Pro:U6MIDI Pro Port 1 160:0"

  bracketed:
    source: "Constructed: a name holding [ beside one holding the letters inside it"
    names:
      - "Some Synth [Pro] 20:0"
      - "Corrode 21:0"

  prophet:
    source: "Constructed: a device whose whole name is inside another's"
    names:
      - "Prophet"
      - "Prophet Rev2"

  identical_units:
    source: "Constructed: two devices reported under one name"
    names:
      - "USB Audio CODEC"
      - "USB Audio CODEC"

cases:

  # A name given in full wins outright, even when longer names contain it.

  - rule: "A full name wins over a longer name containing it"
    list: hpz2g4_audio
    pattern: "default"
    matches: ["default"]

  - rule: "A full name wins over a longer name containing it"
    list: studio_pipewire
    pattern: "default"
    matches: ["default"]

  - rule: "A full name wins over a longer name containing it"
    list: studio_pipewire
    pattern: "auto_null"
    matches: ["auto_null"]

  - rule: "A full name wins over a longer name containing it"
    list: prophet
    pattern: "Prophet"
    matches: ["Prophet"]

  - rule: "A full name wins in any case"
    list: studio_pipewire
    pattern: "DEFAULT"
    matches: ["default"]

  - rule: "A full name wins in any case"
    list: prophet
    pattern: "prophet"
    matches: ["Prophet"]

  - rule: "Two devices reported under one name both match"
    list: identical_units
    pattern: "USB Audio CODEC"
    matches: ["USB Audio CODEC", "USB Audio CODEC"]

  # Otherwise a pattern with no wildcards is a case-insensitive substring, so a
  # shortened name still offers everything it is inside of.

  - rule: "A shortened name matches every name it is inside of"
    list: studio_pipewire
    pattern: "defaul"
    matches: ["default", "Default Sink", "Default Source"]

  - rule: "A shortened name matches every name it is inside of"
    list: studio_pipewire
    pattern: "auto"
    matches: ["auto_null", "auto_null.monitor"]

  - rule: "A shortened name matches every name it is inside of"
    list: prophet
    pattern: "Proph"
    matches: ["Prophet", "Prophet Rev2"]

  - rule: "A shortened name matches every name it is inside of"
    list: hpz2g4_audio
    pattern: "hdmi"
    matches:
      - "HDA NVidia: HDMI 0 (hw:1,3)"
      - "HDA NVidia: HDMI 1 (hw:1,7)"
      - "HDA NVidia: HDMI 2 (hw:1,8)"
      - "HDA NVidia: HDMI 3 (hw:1,9)"

  - rule: "A pattern with no wildcards is a substring"
    list: studio_audio
    pattern: "SC-U"
    matches: ["SC-U: USB Audio (hw:2,0)"]

  - rule: "A pattern with no wildcards is a substring"
    list: studio_midi
    pattern: "SC-U"
    matches: ["SC-U:SC-U MIDI 1 24:0"]

  - rule: "Matching ignores case"
    list: studio_audio
    pattern: "sc-u: usb audio"
    matches: ["SC-U: USB Audio (hw:2,0)"]

  - rule: "Nothing matching is an empty list"
    list: studio_audio
    pattern: "Scarlett"
    matches: []

  # Wildcard the number that moves, and keep the one that does not.

  - rule: "Wildcarding the card keeps an audio device found when it is renumbered"
    list: studio_audio
    pattern: "SC-U: USB Audio (hw:*,0)"
    matches: ["SC-U: USB Audio (hw:2,0)"]

  - rule: "Wildcarding the card keeps an audio device found when it is renumbered"
    list: hpz2g4_audio
    pattern: "HDA NVidia: HDMI 1 (hw:*,7)"
    matches: ["HDA NVidia: HDMI 1 (hw:1,7)"]

  - rule: "The stable index alone does not pick a device"
    list: studio_audio
    pattern: "(hw:*,0)"
    matches:
      - "SC-U: USB Audio (hw:2,0)"
      - "U6MIDI Pro: USB Audio (hw:0,0)"
      - "HDA Intel PCH: ALC256 Analog (hw:1,0)"

  - rule: "Wildcarding the client keeps a MIDI port found when the id moves"
    list: studio_midi
    pattern: "*U6MIDI Pro *:0"
    matches: ["U6MIDI Pro:U6MIDI Pro Port 1 16:0"]

  - rule: "Wildcarding the client keeps a MIDI port found when the id moves"
    list: grown_client_id
    pattern: "*U6MIDI Pro Port 1 *:0"
    matches: ["U6MIDI Pro:U6MIDI Pro Port 1 160:0"]

  - rule: "Wildcarding the client keeps a MIDI port found when the id moves"
    list: hpz2g4_midi
    pattern: "Midi Through:Midi Through Port-0 *:0"
    matches: ["Midi Through:Midi Through Port-0 14:0"]

  - rule: "Without the port index a multi-port interface matches every port"
    list: studio_midi
    pattern: "*U6MIDI Pro*"
    matches:
      - "U6MIDI Pro:U6MIDI Pro Port 1 16:0"
      - "U6MIDI Pro:U6MIDI Pro Port 2 16:1"
      - "U6MIDI Pro:U6MIDI Pro Port 3 16:2"

  # ? is exactly one character, so an id that grows past it stops matching.

  - rule: "? matches exactly one character"
    list: studio_midi
    pattern: "*Port 1 ??:0"
    matches: ["U6MIDI Pro:U6MIDI Pro Port 1 16:0"]

  - rule: "? matches exactly one character"
    list: grown_client_id
    pattern: "*Port 1 ??:0"
    matches: []

  # Nothing else is special.

  - rule: "[ is literal, not a character class"
    list: bracketed
    pattern: "*[Pro]*"
    matches: ["Some Synth [Pro] 20:0"]

  - rule: "A pattern naming rtmidi's direction prefix misses the other direction"
    list: studio_midi
    pattern: "RtMidiIn Client:Subsample*"
    matches: []

  - rule: "A pattern naming rtmidi's direction prefix misses the other direction"
    list: studio_midi
    pattern: "*Subsample Virtual MIDI *:0"
    matches: ["RtMidiOut Client:Subsample Virtual MIDI 129:0"]
