# Run the suite and the type checker on Linux and macOS for every push and
# pull request (#4491), as CONTRIBUTING.md runs them by hand.

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch supersedes a run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      # One platform failing says nothing about the others, so let each finish.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The oldest Python pyproject.toml accepts, and the newest every
        # dependency supports.
        python: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm reads the version from the tags.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # PyAudio builds against PortAudio, soundfile loads libsndfile, and
      # pyrubberband runs the rubberband program.  python-rtmidi has no wheel
      # for every Python, and builds against ALSA where it has none.
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes portaudio19-dev libsndfile1 rubberband-cli libasound2-dev

      - name: Install system libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio libsndfile rubberband

      - name: Install Subsample
        id: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: pytest

      # Runs even when a test failed, so one run reports both.
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy
